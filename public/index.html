<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>SentenceBreak</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#fafafa, #111);
    --fg: light-dark(#222, #eee);
    --dim: light-dark(#999, #777);
    --line: light-dark(#ddd, #2a2a2a);
    --accent: #f43f5e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; max-width: 48rem; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--fg); font: 17px/1.45 system-ui, sans-serif;
  }
  button, input, select { font: inherit; color: inherit; }
  form { display: flex; gap: .5rem; padding: .5rem; padding-top: max(.5rem, env(safe-area-inset-top)); }
  form input { flex: 1; min-width: 0; padding: .5rem .75rem; border: 1px solid var(--line); border-radius: .5rem; background: transparent; }
  form button { padding: .5rem 1rem; border: 0; border-radius: .5rem; background: var(--accent); color: #fff; }
  #video { flex: none; aspect-ratio: 16 / 9; max-height: 40dvh; background: #000; }
  #video iframe { display: block; width: 100%; height: 100%; border: 0; }
  main { flex: 1; overflow-y: auto; padding: .5rem 1rem; }
  #msg { color: var(--dim); text-align: center; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: .5rem .75rem; border-radius: .5rem; cursor: pointer; transition: color .2s, background .2s; }
  li time { display: block; font-size: .75rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  li:has(~ li.cur) { color: var(--dim); }
  li.cur { background: color-mix(in srgb, var(--accent) 15%, transparent); font-weight: 600; }
  li.cur time { color: var(--accent); }
  nav {
    flex: none; display: flex; justify-content: space-around; align-items: center;
    padding: .5rem; padding-bottom: max(.5rem, env(safe-area-inset-bottom)); border-top: 1px solid var(--line);
  }
  nav button { display: grid; place-items: center; width: 3rem; height: 3rem; border: 0; border-radius: 50%; background: none; cursor: pointer; }
  nav button:active { background: var(--line); }
  #play { width: 3.5rem; height: 3.5rem; background: var(--accent); color: #fff; }
  #play .lucide-pause, body.playing #play .lucide-play { display: none; }
  body.playing #play .lucide-pause { display: block; }
  #settings {
    inset: auto max(1rem, calc(50vw - 23rem)) 5.5rem auto; margin: 0; width: min(18rem, calc(100vw - 2rem));
    padding: 1rem; border: 1px solid var(--line); border-radius: .75rem; background: var(--bg);
    box-shadow: 0 8px 24px #0004;
  }
  #ui { display: flex; justify-content: center; gap: .5rem; padding-bottom: .5rem; margin-bottom: .25rem; border-bottom: 1px solid var(--line); }
  #ui button { padding: .3rem; border: 2px solid transparent; border-radius: .5rem; background: none; line-height: 0; cursor: pointer; }
  #ui button[aria-pressed=true] { border-color: var(--accent); }
  #ui img { width: 2rem; height: 2rem; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .4rem 0; }
  #settings select { max-width: 10rem; }
  #settings input[type=checkbox] { width: 1.25rem; height: 1.25rem; accent-color: var(--accent); }
  /* mobile: drawer sliding in from the right */
  #history {
    inset: 0 0 0 auto; margin: 0; width: min(20rem, 85vw); height: auto; padding: .5rem;
    padding-top: max(.5rem, env(safe-area-inset-top)); padding-bottom: max(.5rem, env(safe-area-inset-bottom));
    border: 0; border-left: 1px solid var(--line); background: var(--bg); color: var(--fg); overflow-y: auto;
    transform: translateX(100%); transition: transform .25s, display .25s allow-discrete, overlay .25s allow-discrete;
  }
  #history:popover-open { transform: none; }
  @starting-style { #history:popover-open { transform: translateX(100%); } }
  #history::backdrop { background: #0005; }
  #history h2 { margin: .5rem .75rem; font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
  #history p { margin: .5rem .75rem; color: var(--dim); font-size: .9rem; }
  #hist li { display: flex; align-items: center; padding: 0; }
  #hist li:hover { background: var(--line); }
  #hist button { border: 0; background: none; cursor: pointer; }
  #hist .open { flex: 1; min-width: 0; padding: .5rem .75rem; text-align: left; font-size: .9rem; line-height: 1.3; }
  #hist .open span { display: block; font-size: .8rem; color: var(--dim); }
  #hist .open small { display: block; font-size: .75rem; color: var(--dim); }
  #hist .open time { display: inline; }
  #histbtn { display: grid; place-items: center; }
  #hist .rm { display: grid; padding: .5rem; color: var(--dim); }
  /* desktop: always-visible column right of the content */
  @media (min-width: 60rem) {
    body { max-width: 68rem; display: grid; grid-template: auto auto 1fr auto / 1fr 20rem; }
    body > :not(#history) { grid-column: 1; }
    #history { display: block; position: static; grid-column: 2; grid-row: 1 / -1; width: auto; transform: none; }
    #histbtn { display: none; }
    #settings { right: max(21rem, calc(50vw - 13rem)); }
  }
</style>
</head>
<body>
<form id="form">
  <input id="url" type="url" required autocomplete="off">
  <button data-t="load"></button>
  <button id="histbtn" type="button" popovertarget="history" data-t-label="history"><i data-lucide="history"></i></button>
</form>
<div id="video"><div id="player"></div></div>
<main><p id="msg"></p><ol id="list"></ol></main>
<nav>
  <button id="prev" data-t-label="prev"><i data-lucide="skip-back"></i></button>
  <button id="replay" data-t-label="replay"><i data-lucide="rotate-ccw"></i></button>
  <button id="play" data-t-label="play"><i data-lucide="play"></i><i data-lucide="pause"></i></button>
  <button id="next" data-t-label="next"><i data-lucide="skip-forward"></i></button>
  <button popovertarget="settings" data-t-label="settings"><i data-lucide="settings"></i></button>
</nav>
<aside id="history" popover><h2 data-t="history"></h2><ol id="hist"></ol><p id="histempty" data-t="empty"></p></aside>
<div id="settings" popover>
  <div id="ui">
    <button data-ui="en" aria-label="English"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f1ec-1f1e7.svg" alt=""></button>
    <button data-ui="sv" aria-label="Svenska"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f1f8-1f1ea.svg" alt=""></button>
    <button data-ui="zh-TW" aria-label="繁體中文（台灣）"><img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f1f9-1f1fc.svg" alt=""></button>
  </div>
  <label><span data-t="subs"></span> <select id="lang"></select></label>
  <label><span data-t="autopause"></span> <input id="autopause" type="checkbox"></label>
  <label><span data-t="speed"></span>
    <select id="speed">
      <option>0.25</option><option>0.5</option><option>0.75</option><option>1</option>
      <option>1.25</option><option>1.5</option><option>1.75</option><option>2</option>
    </select>
  </label>
</div>

<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const EPS = 0.03; // seconds of slack around line boundaries
const ytReady = new Promise(r => window.onYouTubeIframeAPIReady = r);

const STRINGS = {
  en: {
    url: 'YouTube URL', load: 'Load', history: 'History', start: 'Paste a YouTube link to start.',
    prev: 'Previous line', replay: 'Replay line', play: 'Play/pause', next: 'Next line', settings: 'Settings',
    subs: 'Subtitles', auto: 'Auto-generated', autopause: 'Pause after each line', speed: 'Speed',
    empty: 'Videos you open show up here.', remove: 'Remove from history',
    tap: 'Tap the video once to enable the controls.', loading: 'Loading subtitles…',
    nolines: 'No subtitle lines found.', err: 'Couldn\'t load subtitles: ', badurl: 'That doesn\'t look like a YouTube link.',
  },
  sv: {
    url: 'YouTube-länk', load: 'Öppna', history: 'Historik', start: 'Klistra in en YouTube-länk för att börja.',
    prev: 'Föregående rad', replay: 'Spela raden igen', play: 'Spela/pausa', next: 'Nästa rad', settings: 'Inställningar',
    subs: 'Undertexter', auto: 'Automatiskt genererade', autopause: 'Pausa efter varje rad', speed: 'Hastighet',
    empty: 'Videor du öppnar visas här.', remove: 'Ta bort från historiken',
    tap: 'Tryck på videon en gång för att aktivera kontrollerna.', loading: 'Laddar undertexter…',
    nolines: 'Inga undertextrader hittades.', err: 'Kunde inte ladda undertexter: ', badurl: 'Det där ser inte ut som en YouTube-länk.',
  },
  'zh-TW': {
    url: 'YouTube 網址', load: '載入', history: '觀看紀錄', start: '貼上 YouTube 連結即可開始。',
    prev: '上一句', replay: '重播這句', play: '播放/暫停', next: '下一句', settings: '設定',
    subs: '字幕', auto: '自動產生', autopause: '每句結束後暫停', speed: '播放速度',
    empty: '你開啟的影片會顯示在這裡。', remove: '從觀看紀錄中移除',
    tap: '請先點一下影片以啟用控制按鈕。', loading: '正在載入字幕…',
    nolines: '找不到字幕內容。', err: '無法載入字幕：', badurl: '這看起來不像 YouTube 連結。',
  },
};
const navLang = navigator.language;
const settings = {
  autoPause: true, speed: 1,
  ui: navLang.startsWith('sv') ? 'sv' : navLang.startsWith('zh') ? 'zh-TW' : 'en',
  lang: '', // subtitle language last picked, the default for new videos
};
try { Object.assign(settings, JSON.parse(localStorage.settings)); } catch {}
if (!STRINGS[settings.ui]) settings.ui = 'en';
settings.lang ||= `m:${settings.ui}`;
const t = key => STRINGS[settings.ui][key];
const save = () => { try { localStorage.settings = JSON.stringify(settings); } catch {} };

let player, vid, cues = [], cur = -1, playing = false, pending = null, lastT = -1, off = null, endTimer = 0;
let atEnd = -1; // index of the line we auto-paused at the end of
let resume = false; // jump to the line they were last at on first play

// video id -> {title, channel, lang, t}, oldest first; t is the start of the line they were last at
let hist = {};
try { hist = JSON.parse(localStorage.history) || {}; } catch {}
const saveHist = () => { try { localStorage.history = JSON.stringify(hist); } catch {} };

const parseId = s => (s.match(/(?:v=|youtu\.be\/|shorts\/|embed\/|live\/)([\w-]{11})/) || s.trim().match(/^([\w-]{11})$/))?.[1];
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let shown = ['start', '']; // [string key, untranslated suffix] of the message, re-rendered on language change
const msg = (key, extra = '') => { shown = [key, extra]; $('#msg').textContent = key ? t(key) + extra : ''; $('#msg').hidden = !key; };
// subtitle key ('m:en', 'a:ja-orig') -> language name in the UI language
const langName = key => { const code = key.slice(2).replace(/-orig$/, ''); try { return new Intl.DisplayNames([settings.ui], { type: 'language' }).of(code); } catch { return code; } };
const indexAt = t => cues.findLastIndex(c => c.start <= t + EPS);

// The iframe API only reports time a few times a second, and we notice each report late.
// Model video time as clock + offset: a report is never early, so the largest offset is the least delayed one.
function now() {
  const t = player.getCurrentTime(), rate = player.getPlaybackRate() || 1, clock = performance.now() / 1000 * rate;
  if (!playing) { off = null; lastT = t; return t; }
  if (t !== lastT) {
    lastT = t;
    const o = t - clock;
    if (off === null || o > off || o < off - 0.1) off = o; // fell well behind: stall or seek, re-anchor
  }
  return Math.min(Math.max(off + clock, t), t + 0.5 * rate); // stay near the last report if reports stop
}

function stopAtEnd() {
  if (!playing || atEnd === cur) return;
  playing = false;
  atEnd = cur;
  player.pauseVideo();
}

function setCur(i) {
  atEnd = -1;
  clearTimeout(endTimer);
  const items = $('#list').children;
  items[cur]?.classList.remove('cur');
  cur = i;
  items[cur]?.classList.add('cur');
  items[cur]?.scrollIntoView({ block: 'center', behavior: 'smooth' });
  if (hist[vid] && cues[i]) {
    hist[vid].t = cues[i].start;
    saveHist();
    const time = $(`#hist [data-id="${vid}"] time`);
    if (time) time.textContent = fmt(cues[i].start);
  }
}

function go(i) {
  if (!player || !cues.length) return;
  i = Math.max(0, Math.min(cues.length - 1, i));
  setCur(i);
  // ignore times until the seek lands: the player keeps reporting the old position for a moment,
  // and with back-to-back lines that old position sits right next to the target
  pending = { t: cues[i].start, from: player.getCurrentTime(), until: Date.now() + 1500 };
  player.seekTo(cues[i].start, true);
  player.playVideo();
}

function togglePlay() {
  if (!player) return;
  if (playing) return player.pauseVideo();
  // auto-paused at the end of a line: play continues with the next one
  if (settings.autoPause && atEnd === cur && cur + 1 < cues.length) go(cur + 1);
  else player.playVideo();
  // mobile browsers refuse scripted playback until the player itself has been tapped once
  setTimeout(() => { if ([YT.PlayerState.CUED, YT.PlayerState.UNSTARTED].includes(player.getPlayerState())) msg('tap'); }, 1500);
}

function tick() {
  if (!player?.getCurrentTime || !cues.length || resume) return;
  const t = now();
  if (pending) {
    const raw = player.getCurrentTime();
    if ((raw === pending.from || Math.abs(raw - pending.t) > 0.5) && Date.now() < pending.until) return;
    pending = null;
  }
  const c = cues[cur];
  if (playing) {
    if (settings.autoPause && c && atEnd !== cur && t < c.end + 1) {
      // poll until the end is under two ticks away, then time the pause exactly
      const left = (c.end - EPS - t) / (player.getPlaybackRate() || 1);
      if (left < 0.06) { clearTimeout(endTimer); endTimer = setTimeout(stopAtEnd, left * 1000); return; }
    }
    const i = indexAt(t);
    if (i !== cur) setCur(i);
  } else if (!c || t < c.start - EPS || t > c.end + 1) {
    setCur(indexAt(t)); // seeked while paused
  }
}
setInterval(tick, 30);

async function openVideo(id) {
  vid = id;
  cues = [];
  resume = false;
  $('#list').replaceChildren();
  await ytReady;
  if (player) return player.cueVideoById(id);
  player = new YT.Player('player', {
    videoId: id,
    playerVars: { playsinline: 1, rel: 0 },
    events: {
      onReady: () => player.setPlaybackRate(settings.speed),
      onStateChange: e => {
        playing = e.data === YT.PlayerState.PLAYING;
        document.body.classList.toggle('playing', playing);
        if (playing) {
          if (resume) { resume = false; go(cur); }
          if (shown[0] === 'tap') msg('');
          if (player.getPlaybackRate() !== settings.speed) player.setPlaybackRate(settings.speed);
        }
      },
    },
  });
}

async function load(id, lang = '', fresh = false) {
  msg('loading');
  try {
    const r = await fetch(`/api/subs?v=${id}&lang=${encodeURIComponent(lang)}&pref=${encodeURIComponent(settings.lang)}`);
    const d = await r.json();
    if (!r.ok) throw Error(d.error);
    if (id !== vid) return; // a different video was opened meanwhile
    cues = d.cues;
    cur = -1;
    $('#list').replaceChildren(...cues.map((c, i) => {
      const li = document.createElement('li');
      li.append(Object.assign(document.createElement('time'), { textContent: fmt(c.start) }), c.text);
      li.onclick = () => go(i);
      return li;
    }));
    const group = (key, auto) => {
      const g = Object.assign(document.createElement('optgroup'), { label: t(key) });
      g.dataset.t = key;
      g.append(...d.langs.filter(l => l.key.startsWith('a:') === auto).map(l => new Option(l.name, l.key)));
      return g.children.length ? [g] : [];
    };
    $('#lang').replaceChildren(...group('subs', false), ...group('auto', true));
    $('#lang').value = d.lang;
    if (fresh) { // move to the top of history, resume where they left off
      const t = hist[id]?.t ?? 0;
      delete hist[id];
      hist[id] = { title: d.title, channel: d.channel, lang: d.lang, t };
      saveHist();
      renderHist();
      if (t) {
        setCur(indexAt(t));
        if (cur >= 0) playing ? go(cur) : (resume = true);
      }
    } else if (hist[id]) {
      hist[id].lang = d.lang;
      saveHist();
    }
    msg(cues.length ? '' : 'nolines');
  } catch (e) {
    msg('err', e.message);
  }
}

function renderHist() {
  const el = tag => document.createElement(tag);
  $('#hist').replaceChildren(...Object.entries(hist).reverse().map(([id, h]) => {
    const li = el('li');
    li.dataset.id = id;
    const open = Object.assign(el('button'), { className: 'open', onclick: () => start(id) });
    const meta = el('small');
    meta.append(Object.assign(el('time'), { textContent: fmt(h.t) }), ...h.lang ? [` · ${langName(h.lang)}`] : []);
    open.append(h.title, Object.assign(el('span'), { textContent: h.channel }), meta);
    const rm = Object.assign(el('button'), { className: 'rm', ariaLabel: t('remove'), onclick: () => { delete hist[id]; saveHist(); renderHist(); } });
    rm.innerHTML = '<i data-lucide="x"></i>';
    li.append(open, rm);
    return li;
  }));
  $('#histempty').hidden = $('#hist').children.length > 0;
  lucide.createIcons();
}

function start(id) {
  if ($('#history').matches(':popover-open')) $('#history').hidePopover();
  openVideo(id);
  load(id, hist[id]?.lang, true);
}
$('#form').onsubmit = e => {
  e.preventDefault();
  const id = parseId($('#url').value);
  if (!id) return msg('badurl');
  start(id);
};
$('#play').onclick = togglePlay;
$('#replay').onclick = () => go(Math.max(cur, 0));
$('#prev').onclick = () => go(cur - 1);
$('#next').onclick = () => go(cur + 1);
$('#lang').onchange = e => { settings.lang = e.target.value; save(); load(vid, settings.lang); };
$('#autopause').checked = settings.autoPause;
$('#autopause').onchange = e => { settings.autoPause = e.target.checked; save(); };
$('#speed').value = settings.speed;
$('#speed').onchange = e => { settings.speed = +e.target.value; player?.setPlaybackRate(settings.speed); save(); };

function applyUi() {
  document.documentElement.lang = settings.ui;
  $('#url').placeholder = t('url');
  for (const e of document.querySelectorAll('[data-t]')) e[e.tagName === 'OPTGROUP' ? 'label' : 'textContent'] = t(e.dataset.t);
  for (const e of document.querySelectorAll('[data-t-label]')) e.ariaLabel = t(e.dataset.tLabel);
  for (const b of $('#ui').children) b.ariaPressed = b.dataset.ui === settings.ui;
  msg(...shown);
  renderHist();
}
for (const b of $('#ui').children) b.onclick = () => {
  settings.ui = b.dataset.ui;
  if (!vid) settings.lang = `m:${settings.ui}`; // nothing loaded yet: subtitles follow the UI language
  save();
  applyUi();
};

applyUi();
navigator.serviceWorker?.register('sw.js');
</script>
<script src="https://www.youtube.com/iframe_api" async></script>
</body>
</html>
